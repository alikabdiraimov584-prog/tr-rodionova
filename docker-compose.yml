# Продакшен на одном сервере: Caddy (TLS) → приложение. База — управляемый PostgreSQL хостера (DATABASE_URL в .env).
services:
  web:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_AT: ${BUILD_AT:-}
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3000
    volumes:
      - uploads:/app/public/uploads
      - backups:/app/backups:ro
    expose:
      - "3000"
    # /api/health проверяет и базу; при старте идут миграции и сид, поэтому start_period длинный
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 180s
    stop_grace_period: 30s

  # Вариант «всё на одном сервере»: PostgreSQL в контейнере. Включается COMPOSE_PROFILES=localdb в .env,
  # тогда DATABASE_URL=postgresql://tr:${DB_PASSWORD}@db:5432/tr_rodionova. Позже можно перейти на управляемую базу.
  db:
    image: postgres:16
    profiles: ["localdb"]
    restart: unless-stopped
    environment:
      - POSTGRES_USER=tr
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=tr_rodionova
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tr -d tr_rodionova"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Ночной дамп базы в общий том (pg_dump той же версии, что и сервер). Загрузку в S3 делает приложение
  # (/api/cron?job=backup) по ключам из CRM → Интеграции. Локально хранится 7 дней.
  backup:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes:
      - backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # состояние последней попытки в /backups/.status: его показывает /api/health (backup.localStatus) и проверка сайта
        status() { echo "$$1 $$(date -u +%FT%TZ)" > /backups/.status.tmp && mv /backups/.status.tmp /backups/.status; }
        dump() {
          f="/backups/tr-rodionova-$$(date -u +%Y%m%d-%H%M).sql.gz"
          # -Z 9: сжатый вывод самим pg_dump, код возврата — именно pg_dump (в конвейере с gzip он терялся)
          if pg_dump -Z 9 -f "$$f.tmp" "$$DATABASE_URL" 2>/tmp/err && [ -s "$$f.tmp" ]; then
            mv "$$f.tmp" "$$f" && echo "backup ok $$f" && status "ok $$(basename "$$f")"
          else
            err=$$(tail -c 300 /tmp/err 2>/dev/null | tr '\n' ' '); rm -f "$$f.tmp"
            echo "backup failed: $$err"; status "failed: $${err:-pg_dump exited with error}"
          fi
          find /backups -name '*.sql.gz' -mtime +7 -delete
        }
        status started
        sleep 60
        # при старте — копия за сегодня, если её ещё нет
        ls /backups/tr-rodionova-$$(date -u +%Y%m%d)-*.sql.gz >/dev/null 2>&1 || dump
        while true; do
          [ "$$(date -u +%H%M)" = "0020" ] && dump && sleep 60
          sleep 30
        done

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Планировщик: ежедневные задачи в 03:10 МСК (00:10 UTC), загрузка бэкапа в S3 в 00:40 UTC, ежечасные (напоминания об оплате, снятие резерва) в :05
  cron:
    image: curlimages/curl:latest
    restart: unless-stopped
    depends_on:
      - web
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          now=$$(date -u +%H%M)
          if [ "$$now" = "0010" ]; then
            curl -fsS -H "Authorization: Bearer $$CRON_SECRET" http://web:3000/api/cron || echo "daily cron failed"
            sleep 60
          elif [ "$$now" = "0040" ]; then
            curl -fsS -H "Authorization: Bearer $$CRON_SECRET" "http://web:3000/api/cron?job=backup" || echo "backup upload failed"
            sleep 60
          elif [ "$${now#??}" = "05" ]; then
            curl -fsS -H "Authorization: Bearer $$CRON_SECRET" "http://web:3000/api/cron?job=hourly" || echo "hourly cron failed"
            sleep 60
          fi
          sleep 30
        done

volumes:
  pgdata:
  uploads:
  backups:
  caddy_data:
  caddy_config:
