# Видимость в поиске снаружи, только чтение: что видят роботы Яндекса и Google (ответ, запреты индексации),
# подтверждение сайта в Вебмастере и Search Console, карта сайта, и сколько страниц находят поисковики по site:.
# Для каждой статьи журнала — ищется ли она по точному заголовку.
# Число просмотров здесь не видно: оно только в Яндекс Метрике (закрытая статистика счётчика).
name: Search visibility
on:
  workflow_dispatch:
    inputs:
      domain:
        description: Домен
        default: tr-rodionova.ru
  schedule:
    - cron: "41 6 * * 1"
jobs:
  visibility:
    runs-on: ubuntu-latest
    steps:
      - name: Проверка
        env:
          D: ${{ github.event.inputs.domain || 'tr-rodionova.ru' }}
        run: |
          python3 - <<'PY'
          import base64, os, re, time, urllib.parse, urllib.request, xml.etree.ElementTree as ET
          D = os.environ["D"]; B = f"https://{D}"
          BROWSER = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          BOTS = {
              "Браузер": BROWSER,
              "YandexBot": "Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)",
              "Googlebot": "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)",
              "Bingbot": "Mozilla/5.0 (compatible; bingbot/2.0; +http://www.bing.com/bingbot.htm)",
              # ИИ-краулеры: Алиса AI (YandexAdditional), ChatGPT (OAI-SearchBot, GPTBot), Claude, Perplexity
              "YandexAdd": "Mozilla/5.0 (compatible; YandexAdditional/3.0; +http://yandex.com/bots)",
              "OAI-Search": "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; OAI-SearchBot/1.0; +https://openai.com/searchbot",
              "GPTBot": "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko); compatible; GPTBot/1.1; +https://openai.com/gptbot",
              "ClaudeBot": "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; ClaudeBot/1.0; +claudebot@anthropic.com)",
              "Perplexity": "Mozilla/5.0 AppleWebKit/537.36 (KHTML, like Gecko; compatible; PerplexityBot/1.0; +https://perplexity.ai/perplexitybot)",
          }
          def get(url, ua=BROWSER):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": ua, "Accept-Language": "ru-RU,ru;q=0.9"}), timeout=40)
                  return r.status, dict(r.headers), r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers or {}), ""
              except Exception as e:
                  return f"ошибка {type(e).__name__}", {}, ""
          def meta(html, name):
              m = re.search(r'<meta[^>]+name="%s"[^>]+content="([^"]*)"' % re.escape(name), html)
              return m.group(1) if m else None

          print("== Главная глазами роботов (код, X-Robots-Tag, meta robots)")
          home = ""
          for who, ua in BOTS.items():
              s, h, html = get(B + "/", ua)
              home = home or html
              print(f"{who:10} {s}  x-robots-tag={h.get('X-Robots-Tag') or h.get('x-robots-tag') or '-'}  meta robots={meta(html, 'robots') or '-'}")

          print("== Подтверждение сайта и аналитика")
          print("Яндекс Вебмастер:", "есть" if meta(home, "yandex-verification") else "НЕТ мета-тега (CRM → Интеграции → Яндекс Вебмастер)")
          print("Google Search Console:", "есть" if meta(home, "google-site-verification") else "НЕТ мета-тега (CRM → Интеграции → Google Search Console)")
          m = re.search(r'<link[^>]+rel="canonical"[^>]+href="([^"]+)"', home)
          print("canonical главной:", m.group(1) if m else "-")

          print("== Сущность бренда для ИИ (разметка Organization на главной, llms.txt, фиды, FAQ)")
          import json
          org = {}
          for block in re.findall(r'<script[^>]+application/ld\+json[^>]*>(.*?)</script>', home, re.S):
              try:
                  data = json.loads(block)
              except Exception:
                  continue
              for x in (data.get("@graph") if isinstance(data, dict) and "@graph" in data else data if isinstance(data, list) else [data]):
                  if isinstance(x, dict) and x.get("@type") in ("Organization", "OnlineStore", "ClothingStore", ["Organization", "OnlineStore"]):
                      org = org or x
          if org:
              same = org.get("sameAs") or []
              cp = (org.get("contactPoint") or [{}])[0]
              print("Organization:", org.get("name"), "| телефон:", org.get("telephone") or cp.get("telephone") or "нет", "| e-mail:", org.get("email") or cp.get("email") or "нет",
                    "| адрес:", "есть" if org.get("address") else "нет", "| основательница:", "есть" if org.get("founder") else "нет")
              print(f"sameAs (площадки бренда вне сайта): {len(same)}", *same, sep="\n    ")
          else:
              print("Organization в разметке главной не найдена")
          for path, need in (("/llms.txt", D), ("/llms-full.txt", D), ("/yml.xml", "<offer"), ("/faq", "FAQPage"), ("/press", "T.Rodionova")):
              s, _, body = get(B + path)
              print(f"{path:15} HTTP {s} {'ok' if need in body else 'нет ожидаемого содержимого'}  {len(body)//1024} КБ")

          print("== Карта сайта")
          s, _, xml = get(B + "/sitemap.xml")
          urls = []
          try:
              urls = [e.text for e in ET.fromstring(xml).iter("{http://www.sitemaps.org/schemas/sitemap/0.9}loc")]
          except Exception as e:
              print("не разобрать:", e)
          print(f"HTTP {s}, адресов: {len(urls)}")
          kinds = {}
          for u in urls:
              k = urllib.parse.urlparse(u).path.strip("/").split("/")[0] or "(главная)"
              kinds[k] = kinds.get(k, 0) + 1
          print("по разделам:", ", ".join(f"{k} {v}" for k, v in sorted(kinds.items(), key=lambda x: -x[1])))
          print("== Выборочно страницы из карты глазами YandexBot")
          bad = 0
          for u in urls[:: max(1, len(urls) // 12)][:12]:
              s, h, html = get(u, BOTS["YandexBot"])
              r = meta(html, "robots") or "-"
              flag = "" if s == 200 and "noindex" not in r and "noindex" not in str(h.get("X-Robots-Tag", "")) else "  <-- проблема"
              bad += bool(flag)
              print(f"{s} {r:30} {u}{flag}")
          print("проблемных:", bad)

          print("== Что находят поисковики по запросу site:" + D)
          q = urllib.parse.quote(f"site:{D}")
          engines = {
              "Яндекс": "https://yandex.ru/search/?lr=213&text=",
              "Google": "https://www.google.com/search?hl=ru&num=50&gbv=1&q=",
              "Bing": "https://www.bing.com/search?setlang=ru&count=50&q=",
              "DuckDuckGo": "https://html.duckduckgo.com/html/?q=",
          }
          def search(name, query):
              """Адреса сайта в выдаче поисковика; None — поисковик показал капчу или пустую страницу роботу."""
              s, _, html = get(engines[name] + urllib.parse.quote(query))
              low = html.lower()
              if s != 200 or "captcha" in low or "unusual traffic" in low or "/sorry/" in low or "enablejs" in low:
                  return None
              # Bing и DuckDuckGo отдают ссылки закодированными (uddg=https%3A%2F%2F…, u=a1aHR0…), а Bing ещё и пишет адрес
              # хлебными крошками «tr-rodionova.ru › journal › …» — приводим всё к обычным адресам
              plain = urllib.parse.unquote(urllib.parse.unquote(html))
              for b in re.findall(r"[?&;]u=a1([A-Za-z0-9_-]+)", html):
                  try:
                      plain += " " + base64.urlsafe_b64decode(b + "=" * (-len(b) % 4)).decode("utf-8", "replace")
                  except Exception:
                      pass
              plain = re.sub(r"<[^>]+>", "", plain).replace("&#8250;", "›").replace(" › ", "/").replace("›", "/")
              plain = plain.replace(f"site:{D}", "").replace(f"site%3A{D}", "")  # сам запрос в поле поиска — не результат
              return {u.rstrip("/.,") for u in re.findall(r"(?:https?://)?(?:www\.)?" + re.escape(D) + r"(?:/[^\s\"'<>&]*)?", plain)}
          blocked = set()
          for name in engines:
              found = search(name, f"site:{D}")
              if found is None:
                  blocked.add(name)
                  print(f"{name:10} показал капчу роботу — проверить вручную: {engines[name]}{urllib.parse.quote('site:' + D)}")
                  continue
              print(f"{name:10} адресов сайта в выдаче: {len(found)}")
              for f in sorted(found)[:25]:
                  print("   ", f)

          print("== Статьи журнала: находит ли поиск статью по точному заголовку")
          s, _, feed = get(B + "/journal/feed.xml")
          items = re.findall(r"<item>.*?<title>(.*?)</title>.*?<link>(.*?)</link>.*?<pubDate>(.*?)</pubDate>", feed, re.S)
          items = [(re.sub(r"<!\[CDATA\[|\]\]>", "", t).strip(), l.strip(), d[5:16]) for t, l, d in items]
          print(f"статей в RSS: {len(items)}")
          live = [n for n in ("Bing", "DuckDuckGo", "Яндекс", "Google") if n not in blocked]
          totals = {n: 0 for n in live}
          for title, link, date in items:
              slug = link.rstrip("/").split("/")[-1]
              marks = []
              for n in live:
                  found = search(n, f'"{title}"')
                  ok = found is not None and any(slug in u for u in found)
                  totals[n] += ok
                  marks.append(f"{n}: {'да' if ok else ('капча' if found is None else 'нет')}")
                  time.sleep(2)
              print(f"{date} | {' | '.join(marks)} | {title[:70]}")
          print("итого найдено:", ", ".join(f"{n} {v} из {len(items)}" for n, v in totals.items()))
          PY
