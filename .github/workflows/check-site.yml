# Внешняя проверка продакшена каждый час: DNS, сертификат, ответ сайта и CRM, база, свежесть бэкапов.
# При сбое — письмо владельцу репозитория от GitHub и, если заданы секреты, сообщение в Telegram.
name: Check site
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      domain:
        description: Домен
        default: tr-rodionova.ru
env:
  DOMAIN: ${{ github.event.inputs.domain || 'tr-rodionova.ru' }}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          D="$DOMAIN"
          echo "== A @8.8.8.8:   $(dig +short "$D" @8.8.8.8 | tr '\n' ' ')"
          echo "== A www:        $(dig +short "www.$D" @8.8.8.8 | tr '\n' ' ')"
          echo "== NS:           $(dig +short NS "$D" | tr '\n' ' ')"
          echo "== CAA:          $(dig +short CAA "$D" | tr '\n' ' ')"
          echo "== A @ns1.reg.ru: $(dig +short "$D" @ns1.reg.ru | tr '\n' ' ')"
      - name: TLS
        run: |
          D="$DOMAIN"
          echo | openssl s_client -servername "$D" -connect "$D:443" 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || echo "TLS: нет соединения"
      - name: HTTP
        run: |
          D="$DOMAIN"
          for p in / /collections /journal /crm /login /robots.txt /sitemap.xml; do
            printf '%-14s %s\n' "$p" "$(curl -sS -m 30 -o /dev/null -w '%{http_code} -> %{redirect_url}' "https://$D$p" 2>&1 || true)"
          done
          echo "== headers"; curl -sSI -m 30 "https://$D/" | grep -iE "^(HTTP|strict-transport|content-security|x-frame|server)" || true
          echo "== версия"; curl -sS -m 30 "https://$D/api/health" || true; echo
          echo "== robots.txt"; curl -sS -m 30 "https://$D/robots.txt" | grep -iE "^(sitemap|host):|localhost" || true
          echo "== llms.txt"; curl -sS -m 30 "https://$D/llms.txt" | head -3
          echo "== title"; curl -sS -m 30 "https://$D/" | grep -oE "<title>[^<]*" | head -1
          echo "== http→https"; curl -sS -m 30 -o /dev/null -w '%{http_code} -> %{redirect_url}\n' "http://$D/" || true
      - name: Итог
        id: verdict
        run: |
          fail=""
          code=$(curl -sS -m 30 -o /dev/null -w '%{http_code}' "https://$DOMAIN/" 2>/dev/null || true)
          echo "Главная: HTTP $code"; [ "$code" = "200" ] || fail="$fail главная HTTP $code;"
          health=$(curl -sS -m 30 "https://$DOMAIN/api/health" 2>/dev/null || echo '{}')
          echo "$health" | grep -q '"ok":true' || fail="$fail база или приложение не отвечают;"
          # фото из CRM пишутся на том uploads: без права записи кнопка «Загрузить фото» не работает
          if echo "$health" | grep -q '"uploads":{"writable":false'; then
            code=$(echo "$health" | sed -n 's/.*"uploads":{"writable":false,"error":"\([^"]*\)".*/\1/p')
            fail="$fail папка загрузок фото недоступна для записи (${code:-нет данных});"
          fi
          # robots.txt и llms.txt должны ссылаться на боевой домен, а не на адрес сборки
          robots=$(curl -sS -m 30 "https://$DOMAIN/robots.txt" 2>/dev/null || true)
          echo "$robots" | grep -q "Sitemap: https://$DOMAIN/sitemap.xml" || fail="$fail robots.txt без ссылки на карту сайта боевого домена;"
          echo "$robots" | grep -qi "localhost" && fail="$fail robots.txt ссылается на localhost;"
          curl -sS -m 30 "https://$DOMAIN/llms.txt" 2>/dev/null | grep -q "https://$DOMAIN" || fail="$fail llms.txt не отдаётся или без боевого адреса;"
          now=$(date -u +%s)
          # ночной дамп должен быть не старше двух суток
          localAt=$(echo "$health" | sed -n 's/.*"localAt":"\([^"]*\)".*/\1/p')
          if [ -n "$localAt" ]; then
            age=$(( (now - $(date -u -d "$localAt" +%s)) / 3600 ))
            echo "Локальный дамп: $localAt (${age} ч)"; [ "$age" -le 48 ] || fail="$fail локальный бэкап старше 2 суток;"
          else
            st=$(echo "$health" | sed -n 's/.*"localStatus":"\([^"]*\)".*/\1/p')
            echo "Локальный дамп: нет (служба дампов: ${st:-нет данных})"; fail="$fail нет локального бэкапа (${st:-нет данных});"
          fi
          # копия в S3 проверяется только когда интеграция включена
          if echo "$health" | grep -q '"s3Enabled":true'; then
            upAt=$(echo "$health" | sed -n 's/.*"uploadedAt":"\([^"]*\)".*/\1/p')
            if [ -n "$upAt" ]; then
              age=$(( (now - $(date -u -d "$upAt" +%s)) / 3600 ))
              echo "Копия в S3: $upAt (${age} ч)"; [ "$age" -le 48 ] || fail="$fail копия в S3 старше 2 суток;"
            else
              echo "Копия в S3: ещё не загружалась"; fail="$fail копия в S3 не загружалась;"
            fi
          fi
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
          [ -z "$fail" ] || { echo "ПРОБЛЕМЫ:$fail"; exit 1; }
      # Тревога в Telegram: секреты TELEGRAM_BOT_TOKEN и TELEGRAM_CHAT_ID в настройках репозитория (Settings → Secrets).
      # Без них шаг просто пропускается, а письмо о падении приходит владельцу репозитория от GitHub.
      - name: Тревога в Telegram
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          FAIL: ${{ steps.verdict.outputs.fail }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_CHAT" ] || { echo "Telegram не настроен"; exit 0; }
          text="⚠️ tr-rodionova.ru: проверка не прошла.${FAIL:+ $FAIL} Подробности: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          curl -sS -m 20 -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$text" -o /dev/null || true
