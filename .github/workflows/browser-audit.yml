# Браузерный аудит боевого сайта и CRM с сервера GitHub: обход страниц, кнопки, формы, гостевой путь, CRM под тестовым сотрудником.
# Секреты (необязательно, для CRM): CRM_TEST_EMAIL, CRM_TEST_PASSWORD, CRM_TEST_TOTP_SECRET — отдельный сотрудник с ролью MANAGER
# и включённой 2FA (ключ из раздела «Безопасность входа» при включении). CUSTOMER_TEST_EMAIL, CUSTOMER_TEST_PASSWORD — тестовая клиентка
# для обхода витрины под её ролью.
name: Browser audit
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Адрес сайта
        default: https://tr-rodionova.ru
      only:
        description: Часть аудита (пусто — всё; site, journey, crm)
        default: ""
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Playwright
        run: |
          npm i --no-save playwright-core@1.63.0 playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Аудит
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://tr-rodionova.ru' }}
          CRM_EMAIL: ${{ secrets.CRM_TEST_EMAIL }}
          CRM_PASSWORD: ${{ secrets.CRM_TEST_PASSWORD }}
          CRM_TOTP_SECRET: ${{ secrets.CRM_TEST_TOTP_SECRET }}
          CUSTOMER_EMAIL: ${{ secrets.CUSTOMER_TEST_EMAIL }}
          CUSTOMER_PASSWORD: ${{ secrets.CUSTOMER_TEST_PASSWORD }}
          ONLY: ${{ github.event.inputs.only }}
        run: node scripts/browser-audit.mjs
      - name: Скриншоты сбоев
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audit-shots
          path: audit-shots/
          if-no-files-found: ignore
