# Продакшен обновляется серверным cron через deploy/autoupdate.sh.
# Этот workflow только проверяет скрипты: он не подключается к серверу и не выдаёт себя за деплой.
name: Server auto-update validation
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate server-side update scripts
        run: |
          set -eu
          test -x deploy/autoupdate.sh
          test -x deploy/update.sh
          bash -n deploy/autoupdate.sh deploy/update.sh
          echo "Update scripts are present and have valid Bash syntax."
          echo "Production rollout is performed by the server cron, not this workflow."
