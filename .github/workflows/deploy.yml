# Автодеплой на продакшен-сервер при push в main. Секреты в GitHub → Settings → Secrets:
#   DEPLOY_HOST (IP), DEPLOY_USER (deploy), DEPLOY_SSH_KEY (приватный ключ, которому разрешён вход под deploy)
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Проверить настройки подключения до запуска SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Автодеплой остановлен до подключения: не заданы обязательные GitHub Secrets:$missing"
            exit 1
          fi
          echo "Настройки подключения присутствуют; значения секретов не выводятся."
      - name: Обновить сервер
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd /opt/tr-rodionova && bash deploy/update.sh
